<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101b22">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-180.png">
  <meta name="application-name" content="God Gathering">
  <meta name="description" content="God Gathering is a standalone card game inspired by stories and art from world religions.">
  <title>God Gathering</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="ad.css">
  <link rel="stylesheet" href="miner.css">
  <link rel="stylesheet" href="accounts.css">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="#home" aria-label="God Gathering home">
        <span class="brand-mark">✦</span><span>GOD <b>GATHERING</b></span>
      </a>
      <nav class="nav" aria-label="Main navigation">
        <button data-view="home" class="active">Home</button>
        <button data-view="match">Duel</button>
        <button data-view="collection">Collection</button>
        <button data-view="market">Booster Hall</button>
        <button data-view="packs">Packs</button>
        <button data-view="adcenter">Sponsor Lab</button>
        <button data-view="account">Account & Trade</button>
        <button data-view="rules">Field Guide</button>
      </nav>
      <button id="install-app" class="install-app" hidden>Install</button>
      <div class="wallet"><span class="coin">✧</span><b id="wallet">0</b><span>marks</span></div>
    </header>
    <main id="app" aria-live="polite"></main>
    <footer><span>GOD GATHERING</span><span>Stories meet at the table.</span><span>Saved on this device</span></footer>
  </div>
  <script src="religion-themes.js"></script>
  <script src="mechanics.js"></script>
  <script src="game.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="backend-config.js"></script>
  <script src="accounts.js"></script>
  <script src="pwa.js"></script>
</body>
</html>
