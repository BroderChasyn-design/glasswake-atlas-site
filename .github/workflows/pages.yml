name: Publish Glasswake Atlas to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Prepare static game
        run: |
          mkdir -p _site
          cp index.html styles.css ad.css miner.css accounts.css accounts.js backend-config.js religion-themes.js mechanics.js mechanics.json game.js pwa.js manifest.json sw.js icon-180.png icon-192.png icon-512.png _site/
          if [ -d rpg ]; then cp -R rpg _site/rpg; fi
          touch _site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
